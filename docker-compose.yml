services:
  app:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on:
      - appflowy-mcp
      - dbhub-mcp
      - analytics-mcp
    # Solo se publica en localhost: el Caddy ya instalado en el servidor
    # hace reverse_proxy hacia 127.0.0.1:${HOST_PORT} y gestiona TLS/dominio.
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3000}:${PORT:-3000}"
    volumes:
      # Persiste los clientes OAuth (custom connector) registrados dinámicamente
      # por claude.ai (ver auth/oauth.ts) entre reinicios del contenedor.
      - oauth_data:/app/data

  # MCP de terceros (https://github.com/CAREEMER/appflowy-mcp). No se publica
  # a host: solo es alcanzable por "app" dentro de la red interna de compose,
  # que la reenvía bajo /appflowy con su propia capa de auth.
  appflowy-mcp:
    image: m2n2/appflowy-mcp:latest
    restart: unless-stopped
    environment:
      APPFLOWY_BASE_URL: ${APPFLOWY_BASE_URL}
      APPFLOWY_EMAIL: ${APPFLOWY_EMAIL}
      APPFLOWY_PASSWORD: ${APPFLOWY_PASSWORD}
      APPFLOWY_MCP_TOKENS: '[{"token":"${APPFLOWY_MCP_INTERNAL_TOKEN}","name":"gateway","scopes":[]}]'

  # MCP de terceros (https://github.com/bytebase/dbhub). Tampoco se publica a
  # host: DBHub no autentica a sus clientes HTTP por diseño, así que solo debe
  # ser alcanzable dentro de la red de compose, detrás de nuestra propia auth
  # en /dbhub.
  dbhub-mcp:
    image: bytebase/dbhub:latest
    restart: unless-stopped
    command:
      - --transport
      - http
      - --port
      - "8080"
      - --dsn
      - ${DBHUB_DSN}

  # MCP oficial de Google (https://github.com/googleanalytics/google-analytics-mcp)
  # más tools de escritura propias (ver docker/analytics-mcp/admin_write_tools.py):
  # el paquete oficial solo trae reporting/lectura (scope analytics.readonly),
  # así que este servicio le añade un segundo cliente de Admin API con scope
  # analytics.edit para poder crear/editar/archivar custom dimensions, custom
  # metrics, key events, audiences, data streams, la config de la propiedad y
  # los vínculos con Google Ads. Ese paquete solo habla stdio, así que este
  # servicio lo construye y lo envuelve en Streamable HTTP con el SDK oficial
  # de MCP para Python (ver docker/analytics-mcp/app.py) en vez de usar un
  # bridge de terceros. Tampoco se publica a host: solo alcanzable por "app"
  # bajo /analytics, con su propia capa de auth (token interno + bearer del
  # gateway) y las credenciales de una service account de GCP dedicada,
  # montadas como archivo de solo lectura (nunca en la imagen). Esa service
  # account necesita rol Editor (no solo Viewer) en las propiedades GA4 que
  # deba poder modificar.
  analytics-mcp:
    build: ./docker/analytics-mcp
    restart: unless-stopped
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/ga-sa-key.json
      GOOGLE_PROJECT_ID: ${GOOGLE_ANALYTICS_PROJECT_ID}
      ANALYTICS_MCP_INTERNAL_TOKEN: ${ANALYTICS_MCP_INTERNAL_TOKEN}
    volumes:
      - ${ANALYTICS_MCP_SA_KEY_PATH}:/secrets/ga-sa-key.json:ro

volumes:
  oauth_data:
